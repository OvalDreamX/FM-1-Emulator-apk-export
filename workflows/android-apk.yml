name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'crates/fm1-android-native/**'
      - 'crates/fm1-core/**'
      - 'crates/fm1-soc/**'
      - 'crates/fm1-live/src/panel*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Rust for Android ARM64
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust emulator for ARM64
        run: cargo ndk -t arm64-v8a -p 26 -o android/app/src/main/jniLibs build --release -p fm1-android-native

      - name: Install Gradle
        run: |
          curl -fsSLo /tmp/gradle-8.13-bin.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle-8.13-bin.zip -d /tmp

      - name: Build signed ARM64 APK
        run: /tmp/gradle-8.13/bin/gradle -p android assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FM1-Emulator-Android-arm64
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
